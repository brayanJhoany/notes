name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.env.*.example'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.env.*.example'

# Gestión de concurrencia: cancela workflows en progreso cuando hay uno nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      # Variables de entorno para tests (desde GitHub Secrets)
      JWT_SECRET_TEST: ${{ secrets.JWT_SECRET_TEST }}
      JWT_ACCESS_EXPIRATION_TEST: ${{ secrets.JWT_ACCESS_EXPIRATION_TEST }}
      JWT_REFRESH_EXPIRATION_TEST: ${{ secrets.JWT_REFRESH_EXPIRATION_TEST }}

    steps:
      # Checkout del código fuente
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configuración de JDK 17 con caché de Maven integrado
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Dar permisos de ejecución al Maven wrapper
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # Validar que el proyecto compile correctamente
      - name: Compile project
        run: ./mvnw clean compile --batch-mode --update-snapshots

      # Ejecutar todas las pruebas unitarias e integración
      - name: Run tests
        run: ./mvnw test --batch-mode -Dspring.profiles.active=test

      # Generar el artefacto empaquetado (JAR)
      - name: Package application
        run: ./mvnw package -DskipTests --batch-mode

      # Subir el JAR generado como artefacto del workflow
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: notes-app
          path: target/*.jar
          retention-days: 7

      # Subir reportes de tests como artefactos
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
