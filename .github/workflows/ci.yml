# ============================================================================
# CI Pipeline - Continuous Integration Workflow
# ============================================================================
#
# Este workflow se ejecuta en cada push o pull request a las ramas main y develop.
#
# CARACTERÍSTICAS:
# - Compilación del proyecto con Maven
# - Análisis de calidad de código (Checkstyle, PMD, SpotBugs)
# - Ejecución de tests unitarios e integración
# - Generación y empaquetado de artefactos JAR
# - Upload de reportes y artefactos
#
# THRESHOLDS DE CALIDAD:
# - Checkstyle: máximo 80 violaciones (actuales: 75)
# - PMD: máximo 150 violaciones (actuales: 53)
# - SpotBugs: máximo 50 bugs (actuales: 46)
#
# CONCURRENCIA:
# - Cancela workflows en progreso cuando hay un nuevo push a la misma rama
# - Optimiza tiempo de ejecución y recursos de GitHub Actions
#
# PATHS IGNORADOS:
# - Archivos de documentación (*.md)
# - Configuraciones de análisis (checkstyle.xml, pmd-ruleset.xml)
# - Archivos de licencia y gitignore
# - Ejemplos de variables de entorno
#
# ARTEFACTOS GENERADOS:
# - notes-app: JAR compilado (retención: 7 días)
# - test-reports: Reportes de tests (retención: 7 días)
# - code-analysis-reports: Reportes de análisis de código (retención: 7 días)
#
# ============================================================================

name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.env.*.example'
      - 'checkstyle.xml'
      - 'pmd-ruleset.xml'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.env.*.example'
      - 'checkstyle.xml'
      - 'pmd-ruleset.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_TEST: ${{ secrets.JWT_SECRET_TEST }}
      JWT_ACCESS_EXPIRATION_TEST: ${{ secrets.JWT_ACCESS_EXPIRATION_TEST }}
      JWT_REFRESH_EXPIRATION_TEST: ${{ secrets.JWT_REFRESH_EXPIRATION_TEST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Compile project
        run: ./mvnw clean compile --batch-mode --update-snapshots

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check --batch-mode

      - name: Run PMD
        run: ./mvnw pmd:check --batch-mode

      - name: Run SpotBugs
        run: ./mvnw spotbugs:check --batch-mode

      - name: Run tests
        run: ./mvnw test --batch-mode -Dspring.profiles.active=test

      - name: Package application
        run: ./mvnw package -DskipTests --batch-mode

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: notes-app
          path: target/*.jar
          retention-days: 7

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload code analysis reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analysis-reports
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml
          retention-days: 7
