# Test Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Se configuran mediante variables de entorno
jwt.secret=${JWT_SECRET_TEST}
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION_TEST}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION_TEST}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.bescobar.notes=DEBUG
