spring.application.name=notes-app
server.port=${SERVER_PORT:80}

# MySQL Database Configuration
# IMPORTANTE: Los valores sensibles se toman de variables de entorno
# Para desarrollo local, usa application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notes}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Suppress Spring Security AuthenticationProvider warning
# Our configuration is correct (we manually configure UserDetailsService in DaoAuthenticationProvider)
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
